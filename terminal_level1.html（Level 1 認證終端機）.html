<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEVEL 1: 研究員認證終端機</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Zen Maru Gothic', 'Fredoka', sans-serif; }
    .font-num { font-family: 'Fredoka', 'Zen Maru Gothic', sans-serif; }
    @keyframes emergencyFlash {
      0%, 100% { background-color: #450a0a; }
      50% { background-color: #991b1b; }
    }
    .emergency-alarm {
      animation: emergencyFlash 0.8s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-[#050b14] text-slate-100 min-h-screen flex flex-col select-none overflow-x-hidden">
  <header class="border-b-2 border-cyan-800/60 bg-[#081220]/90 backdrop-blur px-6 py-4 flex items-center justify-between shadow-lg">
    <div class="flex items-center gap-3">
      <div class="w-4 h-4 rounded-full bg-cyan-400 animate-pulse"></div>
      <span class="text-sm font-num tracking-wider text-cyan-300 font-bold uppercase bg-cyan-950/80 px-2.5 py-1 rounded-full border border-cyan-500/40">TERMINAL // LV1</span>
      <h1 class="text-xl md:text-2xl font-black text-white tracking-wide">🔐 靜電學研究員認證總控台</h1>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="autoFillTestData()" class="px-4 py-2 rounded-2xl bg-slate-800 border-2 border-slate-700 text-sm font-bold hover:border-cyan-400 text-slate-200 transition-all shadow">
        <i class="fa-solid fa-wand-magic-sparkles text-amber-300"></i> 一鍵幫我填寫（測試用）
      </button>
    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 flex flex-col gap-6">
    <!-- 進度卡片 -->
    <div class="bg-slate-900/90 border-2 border-slate-800 rounded-3xl p-5 shadow-xl">
      <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
        <span class="text-sm font-bold text-cyan-300 flex items-center gap-2">
          <i class="fa-solid fa-list-check text-base"></i> 實驗完成進度檢查
        </span>
        <span class="text-sm font-bold text-slate-400" id="progressSummary">檢查中...</span>
      </div>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm font-bold">
        <div id="status-lab01" class="p-3.5 rounded-2xl border-2 border-slate-700 bg-slate-800/40 flex items-center justify-between">
          <span>LAB 01 摩擦起電</span>
          <i class="fa-solid fa-circle-question text-slate-500 text-lg"></i>
        </div>
        <div id="status-lab02" class="p-3.5 rounded-2xl border-2 border-slate-700 bg-slate-800/40 flex items-center justify-between">
          <span>LAB 02 電荷反應</span>
          <i class="fa-solid fa-circle-question text-slate-500 text-lg"></i>
        </div>
        <div id="status-lab03" class="p-3.5 rounded-2xl border-2 border-slate-700 bg-slate-800/40 flex items-center justify-between">
          <span>LAB 03 材料鑑定</span>
          <i class="fa-solid fa-circle-question text-slate-500 text-lg"></i>
        </div>
        <div id="status-lab04" class="p-3.5 rounded-2xl border-2 border-slate-700 bg-slate-800/40 flex items-center justify-between">
          <span>LAB 04 靜電感應</span>
          <i class="fa-solid fa-circle-question text-slate-500 text-lg"></i>
        </div>
      </div>
    </div>

    <!-- 驗證表格 -->
    <div class="bg-[#0c182c] border-2 border-cyan-500/50 rounded-3xl p-6 md:p-8 shadow-2xl flex flex-col gap-7">
      <!-- 區塊一：金鑰代碼 -->
      <div>
        <div class="flex items-center gap-2 text-amber-300 font-bold text-base mb-4">
          <i class="fa-solid fa-key text-xl"></i> 第一關：輸入四座實驗室的「專屬金鑰代碼」
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="bg-slate-900/80 p-3.5 rounded-2xl border-2 border-slate-800">
            <label class="block text-xs font-bold text-slate-300 mb-1.5">🔑 LAB 01 金鑰代碼：</label>
            <input type="text" id="key01" placeholder="ELECTRONS-TRANSFER-01" class="w-full bg-slate-800 border-2 border-slate-700 rounded-xl px-4 py-2.5 text-base font-num font-bold text-amber-300 focus:border-amber-400 outline-none uppercase">
          </div>
          <div class="bg-slate-900/80 p-3.5 rounded-2xl border-2 border-slate-800">
            <label class="block text-xs font-bold text-slate-300 mb-1.5">🔑 LAB 02 金鑰代碼：</label>
            <input type="text" id="key02" placeholder="COULOMB-ATTRACT-REPEL-02" class="w-full bg-slate-800 border-2 border-slate-700 rounded-xl px-4 py-2.5 text-base font-num font-bold text-amber-300 focus:border-amber-400 outline-none uppercase">
          </div>
          <div class="bg-slate-900/80 p-3.5 rounded-2xl border-2 border-slate-800">
            <label class="block text-xs font-bold text-slate-300 mb-1.5">🔑 LAB 03 金鑰代碼：</label>
            <input type="text" id="key03" placeholder="FREE-ELECTRONS-FLOW-03" class="w-full bg-slate-800 border-2 border-slate-700 rounded-xl px-4 py-2.5 text-base font-num font-bold text-amber-300 focus:border-amber-400 outline-none uppercase">
          </div>
          <div class="bg-slate-900/80 p-3.5 rounded-2xl border-2 border-slate-800">
            <label class="block text-xs font-bold text-slate-300 mb-1.5">🔑 LAB 04 金鑰代碼：</label>
            <input type="text" id="key04" placeholder="INDUCTION-NEAR-OPPOSITE-04" class="w-full bg-slate-800 border-2 border-slate-700 rounded-xl px-4 py-2.5 text-base font-num font-bold text-amber-300 focus:border-amber-400 outline-none uppercase">
          </div>
        </div>
      </div>

      <!-- 區塊二：研究推論填空 -->
      <div class="border-t-2 border-slate-800 pt-6">
        <div class="flex items-center gap-2 text-cyan-300 font-bold text-base mb-4">
          <i class="fa-solid fa-brain text-xl"></i> 第二關：填入你的「研究發現與推論」
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="bg-slate-900/80 p-4 rounded-2xl border-2 border-slate-800">
            <label class="block text-sm font-bold text-slate-200 mb-2">1. 摩擦後氣球帶：</label>
            <input type="text" id="ans1" placeholder="例如：負電" class="w-full bg-slate-800 border-2 border-slate-700 rounded-xl px-4 py-3 text-base font-bold text-cyan-200 focus:border-cyan-400 outline-none">
          </div>
          <div class="bg-slate-900/80 p-4 rounded-2xl border-2 border-slate-800">
            <label class="block text-sm font-bold text-slate-200 mb-2">2. 相異電荷會：</label>
            <input type="text" id="ans2" placeholder="例如：吸引" class="w-full bg-slate-800 border-2 border-slate-700 rounded-xl px-4 py-3 text-base font-bold text-cyan-200 focus:border-cyan-400 outline-none">
          </div>
          <div class="bg-slate-900/80 p-4 rounded-2xl border-2 border-slate-800">
            <label class="block text-sm font-bold text-slate-200 mb-2">3. 金屬屬於：</label>
            <input type="text" id="ans3" placeholder="例如：導體" class="w-full bg-slate-800 border-2 border-slate-700 rounded-xl px-4 py-3 text-base font-bold text-cyan-200 focus:border-cyan-400 outline-none">
          </div>
          <div class="bg-slate-900/80 p-4 rounded-2xl border-2 border-slate-800">
            <label class="block text-sm font-bold text-slate-200 mb-2">4. 負電棒靠近金屬球時，近端感應：</label>
            <input type="text" id="ans4" placeholder="例如：正電" class="w-full bg-slate-800 border-2 border-slate-700 rounded-xl px-4 py-3 text-base font-bold text-cyan-200 focus:border-cyan-400 outline-none">
          </div>
        </div>
      </div>

      <!-- 驗證按鈕 -->
      <button onclick="verifyCredentials()" class="w-full py-4 bg-gradient-to-r from-cyan-500 via-blue-500 to-indigo-500 hover:from-cyan-400 hover:to-indigo-400 text-white rounded-2xl font-black text-lg shadow-xl transition-all flex items-center justify-center gap-3">
        <i class="fa-solid fa-fingerprint text-2xl"></i> [ 驗證資格 VERIFY CREDENTIALS ]
      </button>
    </div>
  </main>

  <!-- 全螢幕彈跳視窗 -->
  <div id="overlayModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/90 backdrop-blur-md">
    <!-- 通過卡片 -->
    <div id="grantedCard" class="w-full max-w-lg bg-[#071322] border-4 border-emerald-400 rounded-3xl p-8 text-center shadow-[0_0_60px_rgba(16,185,129,0.4)]">
      <div class="w-20 h-20 rounded-full bg-emerald-500/20 border-4 border-emerald-400 mx-auto flex items-center justify-center text-emerald-400 text-4xl mb-4">
        <i class="fa-solid fa-check"></i>
      </div>
      <div class="text-sm font-num font-bold text-emerald-300 tracking-widest uppercase mb-1">ACCESS GRANTED</div>
      <h2 class="text-2xl md:text-3xl font-black text-white">LEVEL 1 研究員資格認證完成！🎉</h2>
      <p class="text-sm font-bold text-slate-300 mt-3">恭喜你解開所有微觀物理謎題！正在連線展間...</p>
    </div>

    <!-- 2 秒後警報卡片 -->
    <div id="alarmCard" class="hidden w-full max-w-lg emergency-alarm border-4 border-rose-400 rounded-3xl p-8 text-center shadow-[0_0_80px_rgba(244,63,94,0.7)]">
      <div class="w-24 h-24 rounded-full bg-rose-600/50 border-4 border-white mx-auto flex items-center justify-center text-white text-5xl mb-4 animate-bounce">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <div class="text-base font-num font-black text-white tracking-widest uppercase mb-1">⚠ WARNING // 緊 急 警 報</div>
      <h2 class="text-3xl md:text-4xl font-black text-white uppercase tracking-wider">POWER SYSTEM FAILURE</h2>
      <div class="mt-5 p-5 rounded-2xl bg-black/60 border-2 border-rose-400/60 text-left">
        <div class="text-rose-200 text-lg font-black">主能源控制系統失效！⚡</div>
        <div class="text-sm md:text-base text-rose-100 font-bold mt-1.5 leading-relaxed">
          請全體研究員立刻返回 3D 展間前往能源控制區：<br>
          👉 <span class="text-yellow-300 font-black underline">MISSION 1｜修復電路系統</span>
        </div>
      </div>
      <button onclick="copyClearanceCode()" class="mt-6 w-full py-4 bg-white hover:bg-slate-100 text-rose-900 font-black rounded-2xl text-base tracking-wider transition-all flex items-center justify-center gap-2 shadow-xl">
        <i class="fa-solid fa-key text-lg"></i> 複製緊急通行碼並前往 MISSION 1
      </button>
    </div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, duration = 0.2, type = 'sine') {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playAlarmSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      for (let i = 0; i < 4; i++) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, now + i * 0.4);
        osc.frequency.linearRampToValueAtTime(400, now + i * 0.4 + 0.35);
        gain.gain.setValueAtTime(0.12, now + i * 0.4);
        gain.gain.linearRampToValueAtTime(0.01, now + i * 0.4 + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.4);
        osc.stop(now + i * 0.4 + 0.38);
      }
    }

    function checkStoredProgress() {
      const labs = ['lab01', 'lab02', 'lab03', 'lab04'];
      let completedCount = 0;
      labs.forEach((l, idx) => {
        const isDone = localStorage.getItem(`${l}_completed`) === 'true';
        const box = document.getElementById(`status-${l}`);
        if (isDone) {
          completedCount++;
          box.className = 'p-3.5 rounded-2xl border-2 border-emerald-500/60 bg-emerald-950/40 text-emerald-300 flex items-center justify-between font-bold';
          box.querySelector('i').className = 'fa-solid fa-check-circle text-emerald-400 text-lg';
          const storedKey = localStorage.getItem(`${l}_key`);
          if (storedKey) {
            document.getElementById(`key0${idx + 1}`).value = storedKey;
          }
        }
      });
      document.getElementById('progressSummary').innerText = `已完成 ${completedCount} / 4 項實驗`;
    }
    checkStoredProgress();

    function autoFillTestData() {
      document.getElementById('key01').value = 'ELECTRONS-TRANSFER-01';
      document.getElementById('key02').value = 'COULOMB-ATTRACT-REPEL-02';
      document.getElementById('key03').value = 'FREE-ELECTRONS-FLOW-03';
      document.getElementById('key04').value = 'INDUCTION-NEAR-OPPOSITE-04';
      document.getElementById('ans1').value = '負電';
      document.getElementById('ans2').value = '吸引';
      document.getElementById('ans3').value = '導體';
      document.getElementById('ans4').value = '正電';
      playBeep(600, 0.1);
    }

    function verifyCredentials() {
      const k1 = document.getElementById('key01').value.trim().toUpperCase();
      const k2 = document.getElementById('key02').value.trim().toUpperCase();
      const k3 = document.getElementById('key03').value.trim().toUpperCase();
      const k4 = document.getElementById('key04').value.trim().toUpperCase();

      const a1 = document.getElementById('ans1').value.trim();
      const a2 = document.getElementById('ans2').value.trim();
      const a3 = document.getElementById('ans3').value.trim();
      const a4 = document.getElementById('ans4').value.trim();

      const keysValid = (
        k1 === 'ELECTRONS-TRANSFER-01' &&
        k2 === 'COULOMB-ATTRACT-REPEL-02' &&
        k3 === 'FREE-ELECTRONS-FLOW-03' &&
        k4 === 'INDUCTION-NEAR-OPPOSITE-04'
      );

      const ans1Valid = a1.includes('負') || a1.toLowerCase().includes('negative') || a1 === '-';
      const ans2Valid = a2.includes('吸');
      const ans3Valid = a3.includes('導');
      const ans4Valid = a4.includes('正') || a4.toLowerCase().includes('positive') || a4 === '+';

      if (!keysValid) {
        playBeep(220, 0.3, 'sawtooth');
        alert('💡 金鑰代碼填寫不完整或有誤喔！請回各實驗室確認金鑰。');
        return;
      }

      if (!ans1Valid || !ans2Valid || !ans3Valid || !ans4Valid) {
        playBeep(220, 0.3, 'sawtooth');
        alert('💡 研究發現的答案不太對喔！請檢查四個填空是否符合實驗觀察。');
        return;
      }

      triggerAccessSequence();
    }

    function triggerAccessSequence() {
      playBeep(523, 0.15);
      setTimeout(() => playBeep(659, 0.15), 120);
      setTimeout(() => playBeep(784, 0.15), 240);
      setTimeout(() => playBeep(1046, 0.4), 360);

      const modal = document.getElementById('overlayModal');
      const grantedCard = document.getElementById('grantedCard');
      const alarmCard = document.getElementById('alarmCard');

      modal.classList.remove('hidden');
      grantedCard.classList.remove('hidden');
      alarmCard.classList.add('hidden');

      setTimeout(() => {
        grantedCard.classList.add('hidden');
        alarmCard.classList.remove('hidden');
        playAlarmSound();
      }, 2000);
    }

    function copyClearanceCode() {
      const code = 'CLEARANCE-LV1-CIRCUIT-FAIL';
      navigator.clipboard.writeText(code).then(() => {
        alert('🚨 緊急通行碼已複製：' + code + '\n快回 3D 展間進入 MISSION 1 電路修復區！');
      });
    }
  </script>
</body>
</html>
