<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Station 02: 電荷反應探究台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Zen Maru Gothic', 'Fredoka', sans-serif; }
    .font-num { font-family: 'Fredoka', 'Zen Maru Gothic', sans-serif; }
  </style>
</head>
<body class="bg-[#050b14] text-slate-100 min-h-screen flex flex-col select-none overflow-x-hidden">
  <header class="border-b-2 border-violet-800/60 bg-[#081220]/90 backdrop-blur px-6 py-4 flex items-center justify-between shadow-lg">
    <div class="flex items-center gap-3">
      <div class="w-4 h-4 rounded-full bg-violet-400 animate-ping"></div>
      <span class="text-sm font-num tracking-wider text-violet-300 font-bold uppercase bg-violet-950/80 px-2.5 py-1 rounded-full border border-violet-500/40">LAB // 02</span>
      <h1 class="text-xl md:text-2xl font-black text-white tracking-wide">⚡ 電荷反應｜庫侖力小劇場</h1>
    </div>
    <div class="flex items-center gap-2 bg-slate-900/80 px-4 py-2 rounded-2xl border border-slate-700">
      <span class="text-sm font-bold text-slate-300">收集組合：</span>
      <div class="flex gap-2 text-xs font-num font-bold">
        <span id="badge-pp" class="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-500 border border-slate-700">+ / +</span>
        <span id="badge-pn" class="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-500 border border-slate-700">+ / -</span>
        <span id="badge-np" class="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-500 border border-slate-700">- / +</span>
        <span id="badge-nn" class="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-500 border border-slate-700">- / -</span>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 flex flex-col gap-6">
    <div class="bg-violet-950/40 border-2 border-violet-500/40 rounded-3xl p-5 flex flex-col md:flex-row items-center justify-between gap-4 shadow-xl">
      <div class="flex items-center gap-4">
        <div class="w-14 h-14 rounded-2xl bg-violet-500/20 border-2 border-violet-400/50 flex items-center justify-center text-violet-300 text-2xl shadow-inner">
          <i class="fa-solid fa-arrows-left-right animate-pulse"></i>
        </div>
        <div>
          <h2 class="text-base font-bold text-violet-300 uppercase tracking-wider">🎯 實驗任務提示</h2>
          <p class="text-base md:text-lg text-slate-200 font-bold mt-0.5">
            用滑鼠或手指拖曳小電荷球靠近中央大核心，看看它們會「<span class="text-rose-400 font-black">排斥推開</span>」還是「<span class="text-cyan-300 font-black">吸引靠近</span>」！
          </p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="injectCharge('positive')" class="px-4 py-2.5 rounded-2xl bg-rose-900/60 border-2 border-rose-400 hover:bg-rose-800 text-sm font-bold text-rose-200 transition-all flex items-center gap-2 shadow">
          <i class="fa-solid fa-plus-circle text-base"></i> 換成正電球 (+)
        </button>
        <button onclick="injectCharge('negative')" class="px-4 py-2.5 rounded-2xl bg-cyan-900/60 border-2 border-cyan-400 hover:bg-cyan-800 text-sm font-bold text-cyan-200 transition-all flex items-center gap-2 shadow">
          <i class="fa-solid fa-minus-circle text-base"></i> 換成負電球 (-)
        </button>
      </div>
    </div>

    <!-- 舞台畫布 -->
    <div class="relative w-full h-[420px] md:h-[480px] bg-[#070e1c] border-2 border-violet-900/70 rounded-3xl overflow-hidden shadow-2xl flex items-center justify-center" id="canvasContainer">
      <canvas id="coulombCanvas" class="absolute inset-0 cursor-grab active:cursor-grabbing"></canvas>
      <div class="absolute bottom-5 left-5 bg-slate-900/90 backdrop-blur border-2 border-slate-700 rounded-2xl p-4 text-sm font-bold text-slate-200 pointer-events-none shadow-lg">
        <div class="flex items-center gap-2">
          <span>中央核心：</span>
          <span id="coreLabel" class="text-rose-400 text-base font-black">+ 正電</span>
          <span class="text-xs text-slate-400 font-normal">（點擊中央球可切換電性）</span>
        </div>
        <div class="mt-1 flex items-center gap-2">
          <span>相互作用：</span>
          <span id="forceLabel" class="text-emerald-300 text-base font-black">靠近中...</span>
        </div>
      </div>
    </div>

    <!-- 探究題目 -->
    <div id="quizSection" class="bg-[#0c182c] border-2 border-violet-500/60 rounded-3xl p-6 shadow-2xl">
      <div class="flex items-center gap-2 text-violet-300 font-bold text-sm tracking-wider mb-2">
        <i class="fa-solid fa-lightbulb text-yellow-300 text-lg"></i> 規律歸納題 // 電荷的悄悄話
      </div>
      <h3 class="text-lg md:text-xl font-black text-white mb-5 leading-relaxed">
        經過剛才的親手測試，電荷之間的相處原則是：
      </h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div class="bg-slate-900/80 p-4 rounded-2xl border-2 border-slate-800">
          <label class="block text-sm font-bold text-slate-300 mb-2">1. 「相同」的電荷 (+ 配 +、- 配 -) 會：</label>
          <select id="ansSame" class="w-full bg-slate-800 border-2 border-slate-600 rounded-xl px-4 py-3 text-base font-bold text-white focus:border-violet-400 outline-none">
            <option value="">-- 請選擇 --</option>
            <option value="repel">相互排斥（分開）</option>
            <option value="attract">相互吸引（抱在一起）</option>
            <option value="none">完全不理對方</option>
          </select>
        </div>
        <div class="bg-slate-900/80 p-4 rounded-2xl border-2 border-slate-800">
          <label class="block text-sm font-bold text-slate-300 mb-2">2. 「相異」的電荷 (+ 配 -) 會：</label>
          <select id="ansDiff" class="w-full bg-slate-800 border-2 border-slate-600 rounded-xl px-4 py-3 text-base font-bold text-white focus:border-violet-400 outline-none">
            <option value="">-- 請選擇 --</option>
            <option value="repel">相互排斥（分開）</option>
            <option value="attract">相互吸引（抱在一起）</option>
            <option value="none">完全不理對方</option>
          </select>
        </div>
      </div>
      <button onclick="verifyChargeQuiz()" class="mt-6 px-6 py-3.5 bg-violet-600 hover:bg-violet-500 text-white rounded-2xl text-base font-black tracking-wider transition-all flex items-center gap-2 shadow-lg">
        <i class="fa-solid fa-check text-lg"></i> 提交我的推論！
      </button>

      <div id="clueCard" class="hidden mt-6 p-6 rounded-2xl bg-gradient-to-r from-emerald-950/90 to-violet-950/90 border-2 border-emerald-400 shadow-xl">
        <div class="flex items-center justify-between flex-wrap gap-4">
          <div class="flex items-center gap-4">
            <div class="w-14 h-14 rounded-2xl bg-emerald-500/20 border-2 border-emerald-400 flex items-center justify-center text-emerald-300 text-2xl">
              <i class="fa-solid fa-key"></i>
            </div>
            <div>
              <div class="text-sm font-bold text-emerald-300">🎉 太聰明了！成功發現核心口訣：</div>
              <div class="text-lg md:text-xl font-black text-white mt-0.5">同性相斥，異性相吸</div>
              <div class="text-sm font-num font-bold text-slate-300 mt-1">專屬認證金鑰：<span class="text-amber-300 font-black text-base select-all bg-amber-950/60 px-2 py-0.5 rounded-lg border border-amber-500/50">COULOMB-ATTRACT-REPEL-02</span></div>
            </div>
          </div>
          <button onclick="copyKey('COULOMB-ATTRACT-REPEL-02')" class="px-5 py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-900 rounded-2xl text-sm font-black font-num tracking-wider transition-all flex items-center gap-2 shadow-lg">
            <i class="fa-regular fa-copy text-base"></i> 複製金鑰回展間
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playHum(freq, type = 'sine') {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    const canvas = document.getElementById('coulombCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      const rect = document.getElementById('canvasContainer').getBoundingClientRect();
      width = canvas.width = rect.width;
      height = canvas.height = rect.height;
    }
    window.addEventListener('resize', resize);
    resize();

    let core = { x: 0, y: 0, charge: 1, radius: 42 };
    let mobile = { x: 0, y: 0, charge: 1, radius: 32, isDragging: false };

    function initPositions() {
      core.x = width * 0.4;
      core.y = height * 0.5;
      mobile.x = width * 0.72;
      mobile.y = height * 0.5;
    }
    initPositions();

    function injectCharge(type) {
      mobile.charge = type === 'positive' ? 1 : -1;
      mobile.x = width * 0.75;
      mobile.y = height * 0.5;
      playHum(type === 'positive' ? 520 : 380, 'triangle');
    }

    function toggleCore() {
      core.charge = -core.charge;
      document.getElementById('coreLabel').innerText = core.charge > 0 ? '+ 正電' : '- 負電';
      document.getElementById('coreLabel').className = core.charge > 0 ? 'text-rose-400 text-base font-black' : 'text-cyan-400 text-base font-black';
      playHum(core.charge > 0 ? 600 : 320, 'sine');
    }

    function render() {
      ctx.clearRect(0, 0, width, height);

      const dx = mobile.x - core.x;
      const dy = mobile.y - core.y;
      const dist = Math.hypot(dx, dy);
      const isRepel = (core.charge * mobile.charge) > 0;

      // 連線
      ctx.beginPath();
      ctx.setLineDash([6, 6]);
      ctx.lineWidth = 3;
      ctx.strokeStyle = isRepel ? 'rgba(244,63,94,0.45)' : 'rgba(56,189,248,0.45)';
      ctx.moveTo(core.x, core.y);
      ctx.lineTo(mobile.x, mobile.y);
      ctx.stroke();
      ctx.setLineDash([]);

      // 核心
      ctx.save();
      ctx.shadowColor = core.charge > 0 ? '#f43f5e' : '#06b6d4';
      ctx.shadowBlur = 25;
      ctx.fillStyle = core.charge > 0 ? '#e11d48' : '#0891b2';
      ctx.beginPath();
      ctx.arc(core.x, core.y, core.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 30px Fredoka, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(core.charge > 0 ? '+' : '−', core.x, core.y);

      // 移動球
      ctx.save();
      ctx.shadowColor = mobile.charge > 0 ? '#f43f5e' : '#06b6d4';
      ctx.shadowBlur = 20;
      ctx.fillStyle = mobile.charge > 0 ? '#f43f5e' : '#06b6d4';
      ctx.beginPath();
      ctx.arc(mobile.x, mobile.y, mobile.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px Fredoka, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(mobile.charge > 0 ? '+' : '−', mobile.x, mobile.y);

      // 物理受力
      if (!mobile.isDragging) {
        if (isRepel && dist < 230) {
          mobile.x += (dx / dist) * 2.2;
          mobile.y += (dy / dist) * 2.2;
        } else if (!isRepel && dist > 90 && dist < 280) {
          mobile.x -= (dx / dist) * 1.8;
          mobile.y -= (dy / dist) * 1.8;
        }
      }

      mobile.x = Math.max(mobile.radius + 15, Math.min(width - mobile.radius - 15, mobile.x));
      mobile.y = Math.max(mobile.radius + 15, Math.min(height - mobile.radius - 15, mobile.y));

      const forceLbl = document.getElementById('forceLabel');
      if (dist < 280) {
        forceLbl.innerText = isRepel ? '相互排斥！(← 推開 →)' : '相互吸引！(→ 吸住 ←)';
        forceLbl.className = isRepel ? 'text-rose-400 text-base font-black' : 'text-cyan-300 text-base font-black';
        checkCombo(core.charge, mobile.charge);
      } else {
        forceLbl.innerText = '距離稍遠，快靠近一點～';
        forceLbl.className = 'text-slate-400 text-sm font-bold';
      }

      requestAnimationFrame(render);
    }
    render();

    function checkCombo(cQ, mQ) {
      if (cQ > 0 && mQ > 0) markBadge('badge-pp');
      if (cQ > 0 && mQ < 0) markBadge('badge-pn');
      if (cQ < 0 && mQ > 0) markBadge('badge-np');
      if (cQ < 0 && mQ < 0) markBadge('badge-nn');
    }

    function markBadge(id) {
      const el = document.getElementById(id);
      if (el) {
        el.className = 'px-2.5 py-1 rounded-lg bg-emerald-950 text-emerald-300 border border-emerald-400 shadow font-bold';
      }
    }

    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      if (Math.hypot(mx - core.x, my - core.y) < core.radius) {
        toggleCore();
        return;
      }
      if (Math.hypot(mx - mobile.x, my - mobile.y) < mobile.radius * 1.8) {
        mobile.isDragging = true;
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (!mobile.isDragging) return;
      const rect = canvas.getBoundingClientRect();
      mobile.x = e.clientX - rect.left;
      mobile.y = e.clientY - rect.top;
    });

    window.addEventListener('mouseup', () => { mobile.isDragging = false; });

    function verifyChargeQuiz() {
      const same = document.getElementById('ansSame').value;
      const diff = document.getElementById('ansDiff').value;
      if (same === 'repel' && diff === 'attract') {
        playHum(523, 'sine');
        setTimeout(() => playHum(659, 'sine'), 100);
        setTimeout(() => playHum(784, 'sine'), 200);
        document.getElementById('clueCard').classList.remove('hidden');
        localStorage.setItem('lab02_completed', 'true');
        localStorage.setItem('lab02_key', 'COULOMB-ATTRACT-REPEL-02');
      } else {
        playHum(180, 'sawtooth');
        alert('💡 答案不太對喔！想想看剛剛同色球靠近時是分開還是吸在一起？');
      }
    }

    function copyKey(keyText) {
      navigator.clipboard.writeText(keyText).then(() => {
        alert('✨ 金鑰代碼已複製：' + keyText + '\n趕快返回 3D 展間或前往認證終端機！');
      });
    }
  </script>
</body>
</html>
