<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Station 04: 靜電感應探究台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Zen Maru Gothic', 'Fredoka', sans-serif; }
    .font-num { font-family: 'Fredoka', 'Zen Maru Gothic', sans-serif; }
  </style>
</head>
<body class="bg-[#050b14] text-slate-100 min-h-screen flex flex-col select-none overflow-x-hidden">
  <header class="border-b-2 border-emerald-800/60 bg-[#081220]/90 backdrop-blur px-6 py-4 flex items-center justify-between shadow-lg">
    <div class="flex items-center gap-3">
      <div class="w-4 h-4 rounded-full bg-emerald-400 animate-ping"></div>
      <span class="text-sm font-num tracking-wider text-emerald-300 font-bold uppercase bg-emerald-950/80 px-2.5 py-1 rounded-full border border-emerald-500/40">LAB // 04</span>
      <h1 class="text-xl md:text-2xl font-black text-white tracking-wide">🧲 靜電感應｜微觀自由電子大風吹</h1>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="toggleRodCharge()" class="px-4 py-2 rounded-2xl bg-slate-900 border-2 border-slate-700 text-sm font-bold hover:border-emerald-400 text-slate-200 transition-all shadow">
        切換電棒：<span id="rodTypeLabel" class="text-cyan-300 font-black">帶負電棒 (-)</span>
      </button>
    </div>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 flex flex-col gap-6">
    <div class="bg-emerald-950/40 border-2 border-emerald-500/40 rounded-3xl p-5 flex flex-col md:flex-row items-center justify-between gap-4 shadow-xl">
      <div class="flex items-center gap-4">
        <div class="w-14 h-14 rounded-2xl bg-emerald-500/20 border-2 border-emerald-400/50 flex items-center justify-center text-emerald-300 text-2xl shadow-inner">
          <i class="fa-solid fa-magnet animate-pulse"></i>
        </div>
        <div>
          <h2 class="text-base font-bold text-emerald-300 uppercase tracking-wider">🎯 實驗任務提示</h2>
          <p class="text-base md:text-lg text-slate-200 font-bold mt-0.5">
            拉動右邊的滑桿，把電棒「<span class="text-emerald-300 font-black">慢慢靠近金屬球</span>」，仔細看藍色電子跑到哪裡去了！
          </p>
        </div>
      </div>
      <div class="w-full md:w-72 bg-slate-900/80 p-3 rounded-2xl border border-slate-700">
        <label class="block text-xs font-bold text-slate-300 mb-1">電棒靠近程度：</label>
        <input type="range" id="distSlider" min="0" max="100" value="0" class="w-full accent-emerald-400 cursor-pointer h-2 bg-slate-700 rounded-lg">
      </div>
    </div>

    <!-- 舞台畫布 -->
    <div class="relative w-full h-[400px] md:h-[460px] bg-[#070e1c] border-2 border-emerald-900/70 rounded-3xl overflow-hidden shadow-2xl flex items-center justify-center" id="containerArea">
      <canvas id="inductionCanvas" class="absolute inset-0"></canvas>
      <div class="absolute bottom-5 left-6 bg-slate-900/90 backdrop-blur border-2 border-slate-700 rounded-2xl p-4 text-sm font-bold text-slate-200 pointer-events-none shadow-lg">
        <div class="flex items-center gap-2">
          <span>金屬球靠近端：</span>
          <span id="nearStatus" class="font-black text-emerald-300 text-base">電中性 ⚖️</span>
        </div>
        <div class="mt-1 flex items-center gap-2">
          <span>金屬球遠離端：</span>
          <span id="farStatus" class="font-black text-emerald-300 text-base">電中性 ⚖️</span>
        </div>
      </div>
    </div>

    <!-- 探究題目 -->
    <div id="quizSection" class="bg-[#0c182c] border-2 border-emerald-500/60 rounded-3xl p-6 shadow-2xl">
      <div class="flex items-center gap-2 text-emerald-300 font-bold text-sm tracking-wider mb-2">
        <i class="fa-solid fa-lightbulb text-yellow-300 text-lg"></i> 觀察思考題 // 電荷的搬家日記
      </div>
      <h3 class="text-lg md:text-xl font-black text-white mb-5 leading-relaxed">
        當「帶負電的棒子」靠近金屬球時，金屬球裡面發生了什麼事？靠近電棒的那一側會呈現什麼電性？
      </h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="quizOptions">
        <button onclick="checkAnswer(0)" class="text-left p-5 rounded-2xl border-2 border-slate-700 hover:border-emerald-400 hover:bg-emerald-950/40 text-base font-bold transition-all leading-relaxed">
          A. 質子被推到遠處，所以近端感應帶負電
        </button>
        <button onclick="checkAnswer(1)" class="text-left p-5 rounded-2xl border-2 border-slate-700 hover:border-emerald-400 hover:bg-emerald-950/40 text-base font-bold transition-all leading-relaxed">
          B. 自由電子被排斥逃到遠端，近端因缺少電子而感應帶正電！
        </button>
        <button onclick="checkAnswer(2)" class="text-left p-5 rounded-2xl border-2 border-slate-700 hover:border-emerald-400 hover:bg-emerald-950/40 text-base font-bold transition-all leading-relaxed">
          C. 電棒直接像針筒一樣把負電注射進金屬球裡
        </button>
        <button onclick="checkAnswer(3)" class="text-left p-5 rounded-2xl border-2 border-slate-700 hover:border-emerald-400 hover:bg-emerald-950/40 text-base font-bold transition-all leading-relaxed">
          D. 金屬球裡面的正電與負電全部一起消失了
        </button>
      </div>

      <div id="clueCard" class="hidden mt-6 p-6 rounded-2xl bg-gradient-to-r from-emerald-950/90 to-teal-950/90 border-2 border-emerald-400 shadow-xl">
        <div class="flex items-center justify-between flex-wrap gap-4">
          <div class="flex items-center gap-4">
            <div class="w-14 h-14 rounded-2xl bg-emerald-500/20 border-2 border-emerald-400 flex items-center justify-center text-emerald-300 text-2xl">
              <i class="fa-solid fa-key"></i>
            </div>
            <div>
              <div class="text-sm font-bold text-emerald-300">🎉 恭喜完成最後實驗！獲得感應線索：</div>
              <div class="text-lg md:text-xl font-black text-white mt-0.5">負電棒靠近時：近端感應正電，遠端感應負電</div>
              <div class="text-sm font-num font-bold text-slate-300 mt-1">專屬認證金鑰：<span class="text-amber-300 font-black text-base select-all bg-amber-950/60 px-2 py-0.5 rounded-lg border border-amber-500/50">INDUCTION-NEAR-OPPOSITE-04</span></div>
            </div>
          </div>
          <button onclick="copyKey('INDUCTION-NEAR-OPPOSITE-04')" class="px-5 py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-900 rounded-2xl text-sm font-black font-num tracking-wider transition-all flex items-center gap-2 shadow-lg">
            <i class="fa-regular fa-copy text-base"></i> 複製金鑰回展間
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type = 'sine', duration = 0.2) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    const canvas = document.getElementById('inductionCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      const rect = document.getElementById('containerArea').getBoundingClientRect();
      width = canvas.width = rect.width;
      height = canvas.height = rect.height;
    }
    window.addEventListener('resize', resize);
    resize();

    let rodIsNegative = true;
    let approachPct = 0;

    const slider = document.getElementById('distSlider');
    slider.addEventListener('input', (e) => {
      approachPct = parseFloat(e.target.value) / 100;
    });

    function toggleRodCharge() {
      rodIsNegative = !rodIsNegative;
      document.getElementById('rodTypeLabel').innerText = rodIsNegative ? '帶負電棒 (-)' : '帶正電棒 (+)';
      document.getElementById('rodTypeLabel').className = rodIsNegative ? 'text-cyan-300 font-black' : 'text-rose-400 font-black';
      playTone(rodIsNegative ? 300 : 600, 'sine');
    }

    const nuclei = [];
    const sphereRadius = 125;
    const electrons = [];

    function initParticles() {
      nuclei.length = 0;
      electrons.length = 0;
      for (let i = 0; i < 22; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r = Math.sqrt(Math.random()) * (sphereRadius - 20);
        nuclei.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r });
        electrons.push({
          x: Math.cos(angle) * r,
          y: Math.sin(angle) * r,
          baseX: Math.cos(angle) * r,
          baseY: Math.sin(angle) * r
        });
      }
    }
    initParticles();

    function render() {
      ctx.clearRect(0, 0, width, height);

      const sphereCenter = { x: width * 0.65, y: height * 0.5 };
      const rodLeftTarget = sphereCenter.x - sphereRadius - 40;
      const rodLeftInitial = width * 0.05;
      const rodX = rodLeftInitial + (rodLeftTarget - rodLeftInitial) * approachPct;
      const rodY = height * 0.35;
      const rodWidth = 150;
      const rodHeight = 44;

      // 電棒
      ctx.save();
      ctx.fillStyle = rodIsNegative ? '#0891b2' : '#e11d48';
      ctx.shadowColor = rodIsNegative ? '#06b6d4' : '#f43f5e';
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.roundRect(rodX, rodY, rodWidth, rodHeight, [12, 22, 22, 12]);
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px Fredoka, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const signs = rodIsNegative ? '−  −  −  −' : '+  +  +  +';
      ctx.fillText(signs, rodX + rodWidth / 2, rodY + rodHeight / 2);

      // 金屬球
      ctx.save();
      ctx.beginPath();
      ctx.arc(sphereCenter.x, sphereCenter.y, sphereRadius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(30, 41, 59, 0.75)';
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#38bdf8';
      ctx.stroke();
      ctx.restore();

      const shiftDirection = rodIsNegative ? 1 : -1;
      const maxShift = 70 * approachPct;

      // 固定質子 (紅 +)
      nuclei.forEach(n => {
        ctx.fillStyle = '#f43f5e';
        ctx.font = 'bold 16px Fredoka, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('+', sphereCenter.x + n.x, sphereCenter.y + n.y);
      });

      // 自由電子 (藍 -)
      electrons.forEach(e => {
        const targetX = e.baseX + shiftDirection * maxShift;
        e.x += (targetX - e.x) * 0.1;
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 18px Fredoka, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('−', sphereCenter.x + e.x, sphereCenter.y + e.y);
      });

      // 更新近遠端狀態
      const near = document.getElementById('nearStatus');
      const far = document.getElementById('farStatus');
      if (approachPct > 0.3) {
        if (rodIsNegative) {
          near.innerText = '感應帶正電 (+) ⚡';
          near.className = 'font-black text-rose-400 text-base';
          far.innerText = '感應帶負電 (-) ⚡';
          far.className = 'font-black text-cyan-300 text-base';
        } else {
          near.innerText = '感應帶負電 (-) ⚡';
          near.className = 'font-black text-cyan-300 text-base';
          far.innerText = '感應帶正電 (+) ⚡';
          far.className = 'font-black text-rose-400 text-base';
        }
      } else {
        near.innerText = '電中性 ⚖️';
        near.className = 'font-black text-emerald-300 text-base';
        far.innerText = '電中性 ⚖️';
        far.className = 'font-black text-emerald-300 text-base';
      }

      requestAnimationFrame(render);
    }
    render();

    function checkAnswer(idx) {
      const btns = document.querySelectorAll('#quizOptions button');
      btns.forEach(b => b.classList.remove('border-emerald-400', 'border-rose-400', 'bg-emerald-950/60', 'bg-rose-950/60'));
      if (idx === 1) {
        btns[idx].classList.add('border-emerald-400', 'bg-emerald-950/60');
        playTone(523, 'sine', 0.15);
        setTimeout(() => playTone(659, 'sine', 0.15), 100);
        setTimeout(() => playTone(784, 'sine', 0.3), 200);
        document.getElementById('clueCard').classList.remove('hidden');
        localStorage.setItem('lab04_completed', 'true');
        localStorage.setItem('lab04_key', 'INDUCTION-NEAR-OPPOSITE-04');
      } else {
        btns[idx].classList.add('border-rose-400', 'bg-rose-950/60');
        playTone(220, 'sawtooth', 0.25);
      }
    }

    function copyKey(keyText) {
      navigator.clipboard.writeText(keyText).then(() => {
        alert('✨ 金鑰代碼已複製：' + keyText + '\n趕快前往 Level 1 終端機進行最終認證！');
      });
    }
  </script>
</body>
</html>
