<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Station 03: 導體與絕緣體檢驗器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Zen Maru Gothic', 'Fredoka', sans-serif; }
    .font-num { font-family: 'Fredoka', 'Zen Maru Gothic', sans-serif; }
  </style>
</head>
<body class="bg-[#050b14] text-slate-100 min-h-screen flex flex-col select-none overflow-x-hidden">
  <header class="border-b-2 border-amber-800/60 bg-[#081220]/90 backdrop-blur px-6 py-4 flex items-center justify-between shadow-lg">
    <div class="flex items-center gap-3">
      <div class="w-4 h-4 rounded-full bg-amber-400 animate-ping"></div>
      <span class="text-sm font-num tracking-wider text-amber-300 font-bold uppercase bg-amber-950/80 px-2.5 py-1 rounded-full border border-amber-500/40">LAB // 03</span>
      <h1 class="text-xl md:text-2xl font-black text-white tracking-wide">💡 材料測試器｜導體與絕緣體掃描</h1>
    </div>
    <div class="text-sm font-bold text-slate-300 bg-slate-900/80 px-4 py-2 rounded-2xl border border-slate-700">
      已檢驗樣品：<span id="testedCount" class="text-amber-300 font-black text-base font-num">0</span> / 6
    </div>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 flex flex-col gap-6">
    <div class="bg-amber-950/40 border-2 border-amber-500/40 rounded-3xl p-5 flex flex-col md:flex-row items-center justify-between gap-4 shadow-xl">
      <div class="flex items-center gap-4">
        <div class="w-14 h-14 rounded-2xl bg-amber-500/20 border-2 border-amber-400/50 flex items-center justify-center text-amber-300 text-2xl shadow-inner">
          <i class="fa-solid fa-bolt animate-bounce"></i>
        </div>
        <div>
          <h2 class="text-base font-bold text-amber-300 uppercase tracking-wider">🎯 實驗任務提示</h2>
          <p class="text-base md:text-lg text-slate-200 font-bold mt-0.5">
            點選下方的「<span class="text-amber-300 font-black">材料卡片</span>」放進測試台，觀察燈泡會不會發光、電路有沒有通！
          </p>
        </div>
      </div>
      <button onclick="clearDock()" class="px-4 py-2.5 rounded-2xl border-2 border-slate-700 hover:border-amber-400 text-sm font-bold text-slate-300 hover:text-amber-200 transition-all flex items-center gap-2 bg-slate-900/60 shadow">
        <i class="fa-solid fa-eject"></i> 取出材料
      </button>
    </div>

    <!-- 測試電路台 -->
    <div class="relative w-full h-[360px] bg-[#070e1c] border-2 border-amber-900/70 rounded-3xl overflow-hidden shadow-2xl flex flex-col items-center justify-center p-6">
      <div class="relative z-10 flex items-center justify-between w-full max-w-3xl">
        <!-- 電池 -->
        <div class="bg-slate-900/90 border-2 border-slate-700 rounded-2xl p-5 flex flex-col items-center shadow-xl">
          <div class="text-amber-400 text-4xl mb-1"><i class="fa-solid fa-car-battery"></i></div>
          <div class="text-base font-black text-white">9V 直流電源</div>
          <div class="text-xs font-bold font-num text-emerald-400 mt-1 bg-emerald-950/70 px-2 py-0.5 rounded-full">POWER ON</div>
        </div>

        <!-- 放置槽 -->
        <div id="testDock" onclick="dockClicked()" class="w-64 h-40 rounded-3xl border-4 border-dashed border-amber-500/70 bg-amber-950/20 hover:bg-amber-950/40 transition-all flex flex-col items-center justify-center cursor-pointer p-4 text-center">
          <div id="dockPlaceholder">
            <i class="fa-solid fa-plus-circle text-amber-400 text-3xl mb-1 animate-pulse"></i>
            <div class="text-sm font-bold text-slate-300">點下方卡片放入測試</div>
          </div>
          <div id="dockedContent" class="hidden flex flex-col items-center">
            <span id="dockedIcon" class="text-5xl mb-1"></span>
            <span id="dockedName" class="text-lg font-black text-white"></span>
            <span id="dockedStatus" class="text-sm font-bold mt-1"></span>
          </div>
        </div>

        <!-- 燈泡 -->
        <div class="bg-slate-900/90 border-2 border-slate-700 rounded-2xl p-5 flex flex-col items-center shadow-xl">
          <div id="bulbIcon" class="text-slate-600 text-4xl mb-1 transition-all duration-300"><i class="fa-solid fa-lightbulb"></i></div>
          <div class="text-base font-black text-white">檢驗燈泡</div>
          <div id="bulbStatus" class="text-xs font-bold font-num text-slate-400 mt-1 bg-slate-800 px-2 py-0.5 rounded-full">斷路 (熄滅)</div>
        </div>
      </div>
    </div>

    <!-- 6 種材料卡片 -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
      <button onclick="testItem('spoon')" class="p-4 rounded-2xl bg-slate-900/90 border-2 border-slate-700 hover:border-amber-400 flex flex-col items-center gap-2 transition-all shadow hover:scale-105">
        <span class="text-4xl">🥄</span>
        <span class="text-base font-bold text-slate-200">金屬湯匙</span>
      </button>
      <button onclick="testItem('graphite')" class="p-4 rounded-2xl bg-slate-900/90 border-2 border-slate-700 hover:border-amber-400 flex flex-col items-center gap-2 transition-all shadow hover:scale-105">
        <span class="text-4xl">✏️</span>
        <span class="text-base font-bold text-slate-200">石墨筆芯</span>
      </button>
      <button onclick="testItem('plastic')" class="p-4 rounded-2xl bg-slate-900/90 border-2 border-slate-700 hover:border-amber-400 flex flex-col items-center gap-2 transition-all shadow hover:scale-105">
        <span class="text-4xl">🥤</span>
        <span class="text-base font-bold text-slate-200">塑膠吸管</span>
      </button>
      <button onclick="testItem('glass')" class="p-4 rounded-2xl bg-slate-900/90 border-2 border-slate-700 hover:border-amber-400 flex flex-col items-center gap-2 transition-all shadow hover:scale-105">
        <span class="text-4xl">🧪</span>
        <span class="text-base font-bold text-slate-200">玻璃試管</span>
      </button>
      <button onclick="testItem('rubber')" class="p-4 rounded-2xl bg-slate-900/90 border-2 border-slate-700 hover:border-amber-400 flex flex-col items-center gap-2 transition-all shadow hover:scale-105">
        <span class="text-4xl">🧤</span>
        <span class="text-base font-bold text-slate-200">橡膠手套</span>
      </button>
      <button onclick="testItem('wood')" class="p-4 rounded-2xl bg-slate-900/90 border-2 border-slate-700 hover:border-amber-400 flex flex-col items-center gap-2 transition-all shadow hover:scale-105">
        <span class="text-4xl">🪵</span>
        <span class="text-base font-bold text-slate-200">乾燥木塊</span>
      </button>
    </div>

    <!-- 探究題目 -->
    <div id="quizSection" class="bg-[#0c182c] border-2 border-amber-500/60 rounded-3xl p-6 shadow-2xl">
      <div class="flex items-center gap-2 text-amber-300 font-bold text-sm tracking-wider mb-2">
        <i class="fa-solid fa-lightbulb text-yellow-300 text-lg"></i> 微觀歸納題 // 為什麼能通電？
      </div>
      <h3 class="text-lg md:text-xl font-black text-white mb-5 leading-relaxed">
        為什麼金屬和石墨能讓燈泡亮起來，而塑膠和橡膠卻不行？
      </h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="quizOptions">
        <button onclick="checkAnswer(0)" class="text-left p-5 rounded-2xl border-2 border-slate-700 hover:border-amber-400 hover:bg-amber-950/40 text-base font-bold transition-all leading-relaxed">
          A. 導體內部有容易自由移動的「自由電子」，能形成電流
        </button>
        <button onclick="checkAnswer(1)" class="text-left p-5 rounded-2xl border-2 border-slate-700 hover:border-amber-400 hover:bg-amber-950/40 text-base font-bold transition-all leading-relaxed">
          B. 絕緣體裡面一顆電子都沒有，所以完全不能通電
        </button>
        <button onclick="checkAnswer(2)" class="text-left p-5 rounded-2xl border-2 border-slate-700 hover:border-amber-400 hover:bg-amber-950/40 text-base font-bold transition-all leading-relaxed">
          C. 電流其實是原子核（質子）在導線裡面跑來跑去
        </button>
        <button onclick="checkAnswer(3)" class="text-left p-5 rounded-2xl border-2 border-slate-700 hover:border-amber-400 hover:bg-amber-950/40 text-base font-bold transition-all leading-relaxed">
          D. 只有硬硬的固體才能導電，液體絕對都不會導電
        </button>
      </div>

      <div id="clueCard" class="hidden mt-6 p-6 rounded-2xl bg-gradient-to-r from-emerald-950/90 to-amber-950/90 border-2 border-emerald-400 shadow-xl">
        <div class="flex items-center justify-between flex-wrap gap-4">
          <div class="flex items-center gap-4">
            <div class="w-14 h-14 rounded-2xl bg-emerald-500/20 border-2 border-emerald-400 flex items-center justify-center text-emerald-300 text-2xl">
              <i class="fa-solid fa-key"></i>
            </div>
            <div>
              <div class="text-sm font-bold text-emerald-300">🎉 答對了！取得導體密鑰線索：</div>
              <div class="text-lg md:text-xl font-black text-white mt-0.5">金屬屬於導體；導體內具有自由移動的電子</div>
              <div class="text-sm font-num font-bold text-slate-300 mt-1">專屬認證金鑰：<span class="text-amber-300 font-black text-base select-all bg-amber-950/60 px-2 py-0.5 rounded-lg border border-amber-500/50">FREE-ELECTRONS-FLOW-03</span></div>
            </div>
          </div>
          <button onclick="copyKey('FREE-ELECTRONS-FLOW-03')" class="px-5 py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-900 rounded-2xl text-sm font-black font-num tracking-wider transition-all flex items-center gap-2 shadow-lg">
            <i class="fa-regular fa-copy text-base"></i> 複製金鑰回展間
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type = 'sine', duration = 0.2) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    const items = {
      spoon: { name: '金屬湯匙', icon: '🥄', isConductor: true },
      graphite: { name: '石墨筆芯', icon: '✏️', isConductor: true },
      plastic: { name: '塑膠吸管', icon: '🥤', isConductor: false },
      glass: { name: '玻璃試管', icon: '🧪', isConductor: false },
      rubber: { name: '橡膠手套', icon: '🧤', isConductor: false },
      wood: { name: '乾燥木塊', icon: '🪵', isConductor: false }
    };
    const testedSet = new Set();
    let currentItem = null;

    function testItem(key) {
      currentItem = items[key];
      testedSet.add(key);
      document.getElementById('testedCount').innerText = testedSet.size;

      document.getElementById('dockPlaceholder').classList.add('hidden');
      document.getElementById('dockedContent').classList.remove('hidden');
      document.getElementById('dockedIcon').innerText = currentItem.icon;
      document.getElementById('dockedName').innerText = currentItem.name;

      const bulb = document.getElementById('bulbIcon');
      const bulbStatus = document.getElementById('bulbStatus');
      const dStatus = document.getElementById('dockedStatus');

      if (currentItem.isConductor) {
        playTone(660, 'sine', 0.3);
        bulb.className = 'text-amber-300 text-4xl mb-1 drop-shadow-[0_0_25px_#f59e0b] animate-pulse';
        bulbStatus.innerText = '電路導通！(發光 ✨)';
        bulbStatus.className = 'text-xs font-bold font-num text-amber-300 bg-amber-950/80 px-2 py-0.5 rounded-full';
        dStatus.innerText = '⚡ 自由電子順暢流動中！';
        dStatus.className = 'text-sm font-black text-emerald-400 mt-1';
      } else {
        playTone(200, 'sawtooth', 0.2);
        bulb.className = 'text-slate-600 text-4xl mb-1';
        bulbStatus.innerText = '電路斷路 (熄滅)';
        bulbStatus.className = 'text-xs font-bold font-num text-slate-400 bg-slate-800 px-2 py-0.5 rounded-full';
        dStatus.innerText = '❌ 電子被緊緊束縛住囉';
        dStatus.className = 'text-sm font-black text-rose-400 mt-1';
      }
    }

    function clearDock() {
      currentItem = null;
      document.getElementById('dockPlaceholder').classList.remove('hidden');
      document.getElementById('dockedContent').classList.add('hidden');
      document.getElementById('bulbIcon').className = 'text-slate-600 text-4xl mb-1';
      document.getElementById('bulbStatus').innerText = '斷路 (熄滅)';
      document.getElementById('bulbStatus').className = 'text-xs font-bold font-num text-slate-400 bg-slate-800 px-2 py-0.5 rounded-full';
    }

    function dockClicked() {
      if (currentItem) clearDock();
    }

    function checkAnswer(idx) {
      const btns = document.querySelectorAll('#quizOptions button');
      btns.forEach(b => b.classList.remove('border-emerald-400', 'border-rose-400', 'bg-emerald-950/60', 'bg-rose-950/60'));
      if (idx === 0) {
        btns[idx].classList.add('border-emerald-400', 'bg-emerald-950/60');
        playTone(523, 'sine', 0.15);
        setTimeout(() => playTone(659, 'sine', 0.15), 100);
        setTimeout(() => playTone(784, 'sine', 0.3), 200);
        document.getElementById('clueCard').classList.remove('hidden');
        localStorage.setItem('lab03_completed', 'true');
        localStorage.setItem('lab03_key', 'FREE-ELECTRONS-FLOW-03');
      } else {
        btns[idx].classList.add('border-rose-400', 'bg-rose-950/60');
        playTone(220, 'sawtooth', 0.25);
      }
    }

    function copyKey(keyText) {
      navigator.clipboard.writeText(keyText).then(() => {
        alert('✨ 金鑰代碼已複製：' + keyText + '\n趕快返回 3D 展間或前往認證終端機！');
      });
    }
  </script>
</body>
</html>
